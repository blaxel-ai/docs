name: Limits, quotas and pricing

on:
  pull_request:
    paths:
      - '**/*.mdx'
      - 'data/**'
      - 'scripts/limits/**'
      - 'snippets/limits/**'
      - 'package.json'
      - '.github/workflows/check-limits.yml'
  push:
    branches: [main]
    paths:
      - '**/*.mdx'
      - 'data/**'
      - 'scripts/limits/**'
      - 'snippets/limits/**'
      - 'package.json'
      - '.github/workflows/check-limits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the number checks
        run: npm test
      - name: Check generated tables and numbers in docs pages
        run: npm run limits:check
