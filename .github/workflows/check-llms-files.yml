name: llms files

# llms.txt, llms-full.txt and the llms-*.txt product files are generated from
# the pages and docs.json. This fails when they are stale, over their size
# budget or contain a broken internal link. Fix it with `npm run llms`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the llms files
        run: npm run llms:check
